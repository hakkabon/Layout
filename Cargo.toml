[package]
name = "layout"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "layout"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
uniffi = { version = "0.28", optional = true }

[features]
serde = ["dep:serde"]
ffi = ["dep:uniffi"]
# Separate from `ffi` because the bindgen CLI's dependency tree (clap et
# al.) requires a newer edition than the core `ffi` feature does. Only
# needed on the machine that generates Swift bindings, not at runtime.
bindgen-cli = ["ffi", "uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen-cli"]

[[bench]]
name = "pipeline"
harness = false

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
